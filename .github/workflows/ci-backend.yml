name: CI Backend

on:
  pull_request:
    paths:
      - 'apps/backend/**'
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/backend/**'

jobs:
  build-and-test:
    name: Build, Test & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests

      - name: Security audit (DO-06)
        run: npm audit --audit-level=high

  migrate:
    name: Run Prisma Migrations (main only)
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_MIGRATIONS_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma migrations (DO-13)
        run: npx prisma migrate deploy
